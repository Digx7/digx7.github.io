---
layout: grid
title: blogs
---

<div class="Section Header" id="blogs-Header"><h2>Blogs</h2></div>
<section class="grid-section">

  <div class="grid">
    {% assign sorted_posts = site.posts | sort: 'date' | reverse %}
    {% for post in sorted_posts %}
      <a href="{{ post.url | relative_url }}" class="grid-card">
        <div class="grid-content">
          {% if post.image %}
            <img src="{{ post.image | relative_url }}" alt="{{ post.title }} thumbnail">
          {% endif %}
          <h2>{{ post.title }}</h2>
          <i>{{ post.date | date: "%Y-%m-%d" }}</i>
          <p>{{ post.description }}</p>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
