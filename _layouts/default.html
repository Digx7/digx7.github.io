<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
  {% include navbar.html %}
  
  <main>
    {{ content }}
  </main>

  {% include footer.html %}
  <!-- <script src="/Assets/JavaScript/carousel.js"></script> -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const container = document.querySelector(".carousel-container");
      const track = container.querySelector(".carousel-track");
      const items = container.querySelectorAll(".carousel-item");
      const prevBtn = container.querySelector(".carousel-arrow.left");
      const nextBtn = container.querySelector(".carousel-arrow.right");

      let index = 0;

      function getItemsPerView() {
        return window.innerWidth >= 992 ? 4 : 3;
      }

      function updateCarousel() {
        const itemWidth = items[0].getBoundingClientRect().width;
        const scrollAmount = itemWidth * getItemsPerView();
        track.style.transform = `translateX(-${index * scrollAmount}px)`;
      }

      nextBtn.addEventListener("click", () => {
        const maxIndex = Math.ceil(items.length / getItemsPerView()) - 1;
        if (index < maxIndex) {
          index++;
          updateCarousel();
        }
      });

      prevBtn.addEventListener("click", () => {
        if (index > 0) {
          index--;
          updateCarousel();
        }
      });

      window.addEventListener("resize", () => {
        updateCarousel();
      });

      // Initial positioning
      updateCarousel();
  });
</script>


</body>
</html>
