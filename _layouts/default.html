<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
  {% include navbar.html %}
  
  <main>
    {{ content }}
  </main>

  {% include footer.html %}
  <!-- <script src="/Assets/JavaScript/carousel.js"></script> -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const carousels = document.querySelectorAll(".carousel-container");

      carousels.forEach((carousel) => {
        const track = carousel.querySelector(".carousel-track");
        const items = carousel.querySelectorAll(".carousel-item");
        const prevBtn = carousel.querySelector(".carousel-arrow.left");
        const nextBtn = carousel.querySelector(".carousel-arrow.right");
        let index = 0;

        const getItemsPerView = () => window.innerWidth >= 992 ? 4 : 3;

        function updateCarousel() {
          const itemWidth = items[0].getBoundingClientRect().width;
          const scrollAmount = itemWidth * getItemsPerView();
          track.style.transform = `translateX(-${index * scrollAmount}px)`;
        }

        prevBtn.addEventListener("click", () => {
          if (index > 0) {
            index--;
            updateCarousel();
          }
        });

        nextBtn.addEventListener("click", () => {
          const maxIndex = Math.ceil(items.length / getItemsPerView()) - 1;
          if (index < maxIndex) {
            index++;
            updateCarousel();
          }
        });

        window.addEventListener("resize", updateCarousel);

        // --- Touch Support ---
        let startX = 0;
        let endX = 0;

        track.addEventListener("touchstart", (e) => {
          startX = e.touches[0].clientX;
        });

        track.addEventListener("touchmove", (e) => {
          endX = e.touches[0].clientX;
        });

        track.addEventListener("touchend", () => {
          const threshold = 50; // Minimum swipe distance
          const deltaX = endX - startX;

          if (deltaX > threshold && index > 0) {
            index--;
          } else if (deltaX < -threshold && index < Math.ceil(items.length / getItemsPerView()) - 1) {
            index++;
          }

          updateCarousel();
          startX = 0;
          endX = 0;
        });

        updateCarousel();
      });

  });
</script>


</body>
</html>
