<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/article.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/footer.css">
</head>
<body>
  {% include components/navbar.html %}
  
  <main>
    <div class="article-header">
      <h1 class="Section Header">{{page.title}}</h1>
      {% if page.date %}
          <div><i>{{ page.date | date: "%Y-%m-%d"}}</i></div>
      {% endif %}
    </div>

    <div class="article-links">

    </div>

    <div class="article-content">
        {{ content }}
    </div>

    <div class="article-links">
      
    </div>

    <div class="article-footer">

    </div>

  </main>

  {% include components/footer.html %}

  <button id="scrollToTop" title="Back to Top">↑</button>
  
  <script src="/assets/js/scrollToTop.js"></script>


</body>
</html>
