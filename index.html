<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="Styles/styles.css">
</head>
<body>
<div id="NavBar">
    <div class="NavButton" id="NavButton-Logo">
        <img src="Assets/Logos/Digx7-Logo-Black_v2.svg" alt="GitHub" class="social-icon">
    </div>
    <div class="NavButton" id="NavButton-Resume">Resume</div>
    <div class="NavButton" id="NavButton-Projects">Projects</div>
    <div class="NavButton" id="NavButton-Blogs">Blogs</div>
</div>
<div id="Welcome">
    <div id="Welcome-Logo">
        <img src="Assets/Logos/Digx7-Logo-Black_v2.svg" alt="GitHub" class="social-icon">
    </div>
    <div id="Welcome-Header"><h1>Welcome</h1></div>
    <div id="Welcome-Message"><p>Welcome message</p></div>
    <div id="Welcome-ResumeButton">Resume</div>
    <div id="Welcome-Socials">

        <div id="Welcome-Socials-Github">
            <a href="https://github.com/Digx7" target="_blank">
                <img src="Assets/Logos/github-mark.svg" alt="GitHub" class="social-icon">
            </a>
        </div>

        <div id="Welcome-Socials-Itchio">
            <a href="https://digx7.itch.io" target="_blank">
                <img src="Assets/Logos/itchio-logo-textless-black.svg" alt="Itchio" class="social-icon">
            </a>
        </div>

        <div id="Welcome-Socials-LinkedIn">
            <a href="https://digx7.itch.io" target="_blank">
                <img src="Assets/Logos/linkedin-icon.svg" alt="LinkedIn" class="social-icon">
            </a>
        </div>

        <div id="Welcome-Socials-Instagram">
            <a href="https://digx7.itch.io" target="_blank">
                <img src="Assets/Logos/instagram.svg" alt="Instagram" class="social-icon">
            </a>
        </div>

    </div>
</div>
<div id="Projects">
    <div class="Section Header" id="Projects-Header"><h2>Projects</h2></div>
    <div class="Carousel" id="Projects-Carousel">
        <div class="CarouselItem" id="Projects-Carousel-Item1">Project 1</div>
        <div class="CarouselItem" id="Projects-Carousel-Item2">Project 2</div>
        <div class="CarouselItem" id="Projects-Carousel-Item3">Project 3</div>
        <div class="CarouselItem" id="Projects-Carousel-Item4">Project 4</div>
        <div class="CarouselItem" id="Projects-Carousel-Item5">Project 5</div>
    </div>
</div>
<div id="Blogs">
    <div class="Section Header" id="Blogs-Header"><h2>Blogs</h2></div>
    <div class="Carousel" id="Blogs-Carousel">
        <div class="CarouselItem" id="Blogs-Carousel-Item1">Blog 1</div>
        <div class="CarouselItem" id="Blogs-Carousel-Item2">Blog 2</div>
        <div class="CarouselItem" id="Blogs-Carousel-Item3">Blog 3</div>
        <div class="CarouselItem" id="Blogs-Carousel-Item4">Blog 4</div>
        <div class="CarouselItem" id="Blogs-Carousel-Item5">Blog 5</div>
    </div>
</div>
<div id="About">
    <div class="Section Header" id="About-Header"><h2>About</h2></div>
    <div id="About-Content">
        <p>About Content</p>
    </div>
</div>
<div id="Contact">
    <div class="Section Header" id="Contact-Header"><h2>Contact</h2></div>
    <div id="Contact-Content">
        <p>Contact Content</p>
    </div>
</div>
<div id="Footer">
    <p>Footer</p>
</div>
</body>
</html>
